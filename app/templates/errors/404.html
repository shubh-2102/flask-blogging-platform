{% extends "base.html" %}

{% block title %}Page Not Found - 404{% endblock %}

{% block content %}
<div class="card" style="text-align: center; max-width: 600px; margin: 3rem auto; padding: 3rem 2rem;">
  <h1 style="font-size: 4rem; font-weight: 800; color: var(--primary);">404</h1>
  <h2 style="font-size: 1.5rem; margin-bottom: 1rem;">Page Not Found</h2>
  <p class="card-text">The page you were looking for doesn't exist or has been moved.</p>
  <a href="{{ url_for('main.index') }}" class="btn btn-primary" style="margin-top: 1rem;">Return Home</a>
</div>
{% endblock %}
