{% extends "base.html" %}

{% block title %}Register | Flask Blogging Platform{% endblock %}

{% block content %}
<div class="card" style="max-width: 480px; margin: 3rem auto; padding: 2.5rem;">
  <span class="card-tag">Authentication (Week 2 Preview)</span>
  <h2 class="card-title" style="font-size: 1.6rem; margin-top: 0.5rem;">Create Your Account</h2>
  <p class="card-text">Join the blogging platform to write, read, and comment.</p>

  <form method="POST" action="{{ url_for('auth.register') }}" style="display: flex; flex-direction: column; gap: 1rem; margin-top: 1rem;">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div>
      <label style="display: block; font-size: 0.88rem; font-weight: 600; margin-bottom: 0.35rem;">Username</label>
      <input type="text" name="username" required placeholder="johndoe" style="width: 100%; padding: 0.65rem 0.85rem; border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 0.95rem;">
    </div>
    <div>
      <label style="display: block; font-size: 0.88rem; font-weight: 600; margin-bottom: 0.35rem;">Email Address</label>
      <input type="email" name="email" required placeholder="you@example.com" style="width: 100%; padding: 0.65rem 0.85rem; border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 0.95rem;">
    </div>
    <div>
      <label style="display: block; font-size: 0.88rem; font-weight: 600; margin-bottom: 0.35rem;">Password</label>
      <input type="password" name="password" required placeholder="Create a strong password" style="width: 100%; padding: 0.65rem 0.85rem; border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 0.95rem;">
    </div>
    <button type="submit" class="btn btn-primary" style="margin-top: 0.5rem; width: 100%;">Create Account</button>
  </form>

  <p style="text-align: center; margin-top: 1.5rem; font-size: 0.88rem; color: var(--text-muted);">
    Already have an account? <a href="{{ url_for('auth.login') }}">Log in</a>
  </p>
</div>
{% endblock %}
