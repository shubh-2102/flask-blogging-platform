version: '3.8'

services:
  web:
    build: .
    container_name: flask_blogging_app
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - SECRET_KEY=production-secure-random-key-diy-internship-2026
      - DATABASE_URL=sqlite:////app/instance/blog.db
    volumes:
      - blog_data:/app/instance
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  blog_data:
    driver: local
